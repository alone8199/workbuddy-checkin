name = "wb-checkin"
main = "src/worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# 每日定时触发。Cron 用 UTC 时间，这里 22:00 UTC = 北京时间次日 06:00。
# Worker 触发后会再做 0~5 秒短随机延迟。若想更分散，可加多条 cron 或改 worker.js 里的延迟。
[triggers]
crons = ["0 22 * * *"]

# 需要先创建 KV 命名空间存日志：
#   wrangler kv namespace create LOGS
# 然后把返回的 id 填到下面。
[[kv_namespaces]]
binding = "LOGS"
id = "22ca1c5a047247f9bb7c218adf968787"

# 面板访问密钥（可选）。设置后访问面板/接口需带 ?key= 或 X-Key 头；
# 不设置则不鉴权（任何人可访问，建议务必设置或用 Cloudflare Access 保护）。
# 凭据（必填，JSON 格式，内容同 credentials.json）：
#   wrangler secret put CREDENTIALS
#   粘贴 {"uid":"...","accessToken":"...","domain":"www.workbuddy.cn"}
# 可选面板密钥：
#   wrangler secret put PANEL_KEY
#   输入一个强密钥
